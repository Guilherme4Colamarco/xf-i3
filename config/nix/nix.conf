# Nix (user) — useful and reasonably stable experimental features
experimental-features = nix-command flakes pipe-operators ca-derivations fetch-closure verified-fetches configurable-impure-env

# Quality of life
warn-dirty = false
log-lines = 30
show-trace = true
keep-outputs = true
keep-derivations = true
fallback = true
connect-timeout = 5
download-buffer-size = 268435456
