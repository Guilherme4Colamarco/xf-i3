# picom para i3 + XFCE (GTX 1660 Ti, DP-0 a 165 Hz): animações + blur.
#
# - Tiled ficam chapadas; flutuantes ganham sombra e cantos arredondados.
# - Abrir: zoom + fade curtos. Fechar: um pouco mais rápido.
# - O tiling desliza para o lugar quando as janelas se reorganizam
#   (geometry-change; experimental no picom, ver a regra "GEOMETRIA" no fim).
# - Notificações entram pela direita; menus e tooltips quase instantâneos.
# - Blur atrás do que é translúcido: kitty, rofi, notificações e painel.
# Recarregar sem logout: pkill -USR1 -x picom
# Iniciado pelo XFCE: ~/.config/autostart/picom.desktop

backend = "glx";
vsync = true;
use-damage = true;
# jogos/vídeo em tela cheia saem do compositor (sem latência extra)
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;

shadow = false;
shadow-radius = 16;
shadow-opacity = 0.40;
shadow-offset-x = -14;
shadow-offset-y = -10;

# fade só para mudanças de opacidade; abrir/fechar usam as animações abaixo
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 5;

corner-radius = 0;

blur: {
  method = "dual_kawase";
  strength = 6;
};

# ── animações globais ───────────────────────────────────────────────────────
animations = ({
  triggers = [ "open", "show" ];
  preset = "appear";
  scale = 0.94;
  duration = 0.16;
}, {
  triggers = [ "close", "hide" ];
  preset = "disappear";
  scale = 0.96;
  duration = 0.11;
}, {
  triggers = [ "geometry" ];
  preset = "geometry-change";
  duration = 0.17;
})

# ── regras por janela (aplicadas em ordem; a última que casar vence) ────────
rules: ({
  # i3 marca o frame das janelas flutuantes com I3_FLOATING_WINDOW
  match = "I3_FLOATING_WINDOW@";
  shadow = true;
  corner-radius = 8;
}, {
  # terminal translúcido com blur (a opacidade vem do kitty.conf)
  match = "class_g = 'kitty'";
  blur-background = true;
}, {
  # apps GTK "de vidro": o GTK 3 não deixa só o fundo transparente (os apps
  # não pedem janela com canal alfa), então a janela toda fica levemente
  # translúcida e o blur atrás faz o efeito. Browser, vídeo, imagens e jogos
  # ficam de fora de propósito. Para mudar: troque o opacity (1.0 = opaco).
  match = "class_g ~?= '^(thunar|mousepad|xfce4-settings-manager|xfce4-.*-settings|"
          "xfce4-settings-editor|xfce4-appfinder|xfce4-taskmanager|xfce4-about|"
          "xfce4-screensaver-preferences|xfce4-screenshooter|xfce4-panel|pavucontrol|"
          "blueman-manager|blueman-services|nm-connection-editor|file-roller|engrampa|"
          "lightdm-gtk-greeter-settings|qt6ct|galculator|easyeffects|"
          "com.github.wwmm.easyeffects)$' && window_type != 'dock'";
  opacity = 0.92;
  blur-background = true;
}, {
  # rofi: fundo translúcido vem do tema (~/.cache/iris/colors.rasi)
  match = "class_g = 'Rofi'";
  blur-background = true;
  shadow = true;
  corner-radius = 10;
  animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.97;
    duration = 0.12;
  }, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 1.0;
    duration = 0.08;
  });
}, {
  # notificações: entram e saem pela direita, com blur
  match = "class_g = 'Xfce4-notifyd'";
  blur-background = true;
  shadow = true;
  corner-radius = 8;
  animations = ({
    triggers = [ "open", "show" ];
    preset = "fly-in";
    # direction = lado da tela de onde ela vem
    direction = "right";
    duration = 0.22;
  }, {
    triggers = [ "close", "hide" ];
    preset = "fly-out";
    direction = "right";
    duration = 0.18;
  });
}, {
  # painel: fundo translúcido vem do tema GTK (panel_bg_color); só fade
  match = "window_type = 'dock'";
  blur-background = true;
  shadow = false;
  corner-radius = 0;
  animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 1.0;
    duration = 0.2;
  });
}, {
  # menus, dropdowns e tooltips: quase instantâneos, sem zoom
  match = "window_type = 'menu' || window_type = 'dropdown_menu' || "
          "window_type = 'popup_menu' || window_type = 'tooltip' || "
          "window_type = 'combo' || window_type = 'dnd'";
  shadow = true;
  animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 1.0;
    duration = 0.06;
  }, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 1.0;
    duration = 0.05;
  });
}, {
  # overview (skippy-xd, Super+Tab): ele mesmo anima as miniaturas; aqui só
  # um fade curto. Sem blur: atrás dele as miniaturas translúcidas viram borrão
  match = "class_i = 'skippy-xd' || class_g = 'skippy-xd' || name = 'skippy-xd'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
  animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 1.0;
    duration = 0.08;
  }, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 1.0;
    duration = 0.08;
  });
}, {
  # plank: a janela transparente é maior que a barra (para o zoom dos ícones);
  # sem blur, sombra ou animações do picom
  match = "(class_g = 'Plank' || class_i = 'plank') && window_type = 'dock'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
  animations = ();
}, {
  match = "window_type = 'desktop' || fullscreen";
  shadow = false;
  corner-radius = 0;
}, {
  # apps com decoração própria (CSD) já desenham a sombra
  match = "_GTK_FRAME_EXTENTS@";
  shadow = false;
  corner-radius = 0;
  blur-background = false;
})
