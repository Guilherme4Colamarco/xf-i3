# iris -> i3. Renderizado em ~/.cache/iris/i3-colors.conf e incluído pelo
# ~/.config/i3/config. Edite ~/.config/iris/templates/i3-colors.conf.
# class                 borda      fundo      texto  indicador  child_border
client.focused          {accent}   {accent}   {bg}   {yellow}   {accent}
client.focused_inactive {surface}  {surface}  {fg}   {surface}  {surface}
client.unfocused        {bg}       {bg}       {dim}  {bg}       {bg}
client.urgent           {red}      {red}      {bg}   {red}      {red}
